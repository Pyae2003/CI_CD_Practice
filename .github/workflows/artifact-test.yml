name: ArtiFact Test

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Node Set up
              uses: actions/setup-node@v4
              with:
                node-version: '20'

            - name: Depencies Install
              run: npm ci
            
            - name: Build Project
              run: npm run build

            - name: Store Build Artifact File
              uses: actions/upload-artifact@v4
              with:
                name: react-dist-files
                path: dist/

    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get Artifact From Build
              uses: actions/download-artifact@v4
              with:
                name: react-dist-files
                path: ./dist

            - name: Verify Downloaded Files
              run: ls -la ./dist
              

            