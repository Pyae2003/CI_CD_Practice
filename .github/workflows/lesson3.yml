name: lesson-3 WorkFlow - Setup Node and install dependencies

on:
  push:
    branches:
      - main

jobs:
  node-ci-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Get All File To Server
        uses: actions/checkout@v4

      - name: Node Set Up
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Test code
        run: npm test